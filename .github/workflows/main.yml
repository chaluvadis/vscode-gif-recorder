name: Build & Publish VS Code Extension

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc -p ./ --noEmit

      - name: Lint
        run: pnpm exec biome lint .

      - name: Run unit tests
        run: pnpm exec mocha --ui tdd --reporter spec out/test/suite/gifProcessing.test.js

  build-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Build production bundles
        run: pnpm run esbuild:prod

      - name: Package extension
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"

          if [ -z "$TAG" ]; then
            TAG="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi

          OUT="vscode-gif-recorder-${TAG}.vsix"

          echo "OUT=${OUT}" >> "$GITHUB_ENV"
          echo "Packaging VSIX -> ${OUT}"

          pnpm exec vsce package \
            --no-dependencies \
            --out "${OUT}"

      - name: Get VSIX filename
        shell: bash
        run: |
          VSIX_NAME="$(ls -1 *.vsix | head -n 1)"

          if [ -z "$VSIX_NAME" ]; then
            echo "No VSIX file found"
            exit 1
          fi

          echo "VSIX_NAME=${VSIX_NAME}" >> "$GITHUB_ENV"

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          pnpm exec vsce publish \
            --packagePath "${{ env.VSIX_NAME }}" \
            --pat "${{ secrets.VSCE_TOKEN }}"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ env.VSIX_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}